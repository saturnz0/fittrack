<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0B0F14">
  <meta name="description" content="FitTrack — acompanhamento de treinos e evolução de cargas.">
  <style>
:root{
  --bg:#0B0F14;--panel:#141A21;--panel2:#1B222B;--text:#F5F7FA;--muted:#8B95A3;
  --green:#B8F34A;--green2:#7FAF2F;--danger:#FF5C5C;--blue:#5CA9FF;
  --border:rgba(255,255,255,.07);--radius:16px;
}
*{box-sizing:border-box}html,body{margin:0;background:#06090d;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh}button,input{font:inherit}button{cursor:pointer}
#app{width:100%;max-width:520px;min-height:100vh;margin:auto;background:var(--bg);position:relative;overflow:hidden}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;padding:22px 20px 12px;position:sticky;top:0;background:linear-gradient(var(--bg) 82%,transparent);z-index:5}
.eyebrow{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.12em;margin-bottom:4px}
h1,h2,h3,p{margin:0}.topbar h1{font-size:24px;line-height:1.1}.icon-btn{width:40px;height:40px;border:1px solid var(--border);border-radius:12px;background:var(--panel);color:var(--text)}
.screen{padding:8px 20px 104px}.section-head{display:flex;justify-content:space-between;align-items:center;margin:22px 0 12px}.section-head h2{font-size:18px}.link{color:var(--green);font-size:13px;font-weight:800;background:none;border:0}
.hero{background:linear-gradient(145deg,#19221b,#121820 58%,#10151b);border:1px solid var(--border);border-radius:20px;padding:20px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;width:170px;height:170px;border-radius:50%;right:-80px;top:-80px;background:rgba(184,243,74,.09)}
.hero .tag{display:inline-flex;padding:6px 9px;border-radius:8px;background:rgba(184,243,74,.12);color:var(--green);font-size:11px;font-weight:900}
.hero h2{font-size:25px;margin:12px 0 5px}.hero p{color:var(--muted);font-size:13px}
.primary{width:100%;height:50px;border:0;border-radius:12px;background:var(--green);color:#0B0F14;font-weight:900;margin-top:18px}
.secondary{height:44px;padding:0 15px;border-radius:12px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-weight:800}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}.stat{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:15px}.stat .value{font-size:22px;font-weight:900}.stat .label{font-size:11px;color:var(--muted);margin-top:4px}.up{color:var(--green);font-size:11px;font-weight:800;margin-top:3px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:15px}.stack{display:grid;gap:10px}
.workout-card{display:flex;align-items:center;gap:12px}.workout-icon{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--green);color:#0B0F14;font-weight:1000}.workout-info{flex:1}.workout-info strong{display:block;font-size:15px}.workout-info span{display:block;color:var(--muted);font-size:12px;margin-top:4px}.play{width:38px;height:38px;border:0;border-radius:50%;background:var(--green);color:#0B0F14;font-weight:900}
.exercise-card{padding:15px}.exercise-top{display:flex;justify-content:space-between;gap:10px}.exercise-name{font-weight:900}.exercise-meta{color:var(--muted);font-size:12px;margin-top:5px}.pill{font-size:10px;color:var(--muted);border:1px solid var(--border);padding:5px 8px;border-radius:999px}
.exercise-row{display:grid;grid-template-columns:1fr 72px 64px 38px;gap:7px;align-items:center;margin-top:12px}.input{width:100%;height:42px;border:1px solid var(--border);background:var(--panel2);border-radius:10px;color:var(--text);padding:0 9px;text-align:center;outline:none}.input:focus{border-color:var(--green)}.check{height:42px;border-radius:10px;border:1px solid var(--border);background:var(--panel2);color:var(--muted)}.check.done{background:rgba(184,243,74,.14);border-color:var(--green);color:var(--green)}
.tabs{display:flex;gap:6px;background:var(--panel);padding:4px;border-radius:12px;margin-bottom:14px}.tab{flex:1;height:36px;border:0;background:transparent;color:var(--muted);border-radius:9px;font-weight:800;font-size:12px}.tab.active{background:var(--green);color:#0B0F14}
.chart-card{padding:15px}.chart-title{font-size:14px;font-weight:900;margin-bottom:8px}.chart-wrap{height:210px}.chart-wrap svg{width:100%;height:100%;overflow:visible}.axis{stroke:rgba(255,255,255,.08);stroke-width:1}.line{fill:none;stroke:var(--green);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.dot{fill:var(--green);stroke:#0B0F14;stroke-width:3}.chart-label{fill:var(--muted);font-size:9px}.chart-value{fill:var(--text);font-size:10px;font-weight:800}
.progress-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.progress-box{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px}.progress-box strong{font-size:20px;display:block}.progress-box span{font-size:11px;color:var(--muted)}.record{color:var(--green)}
.profile{display:flex;align-items:center;gap:13px}.avatar{width:54px;height:54px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;font-size:20px;font-weight:900;color:var(--green)}.menu-row{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid var(--border)}.menu-row:last-child{border-bottom:0}.menu-row span{color:var(--muted);font-size:13px}
.back{border:0;background:none;color:var(--text);padding:0;font-size:24px}.screen-title{display:flex;align-items:center;gap:12px;margin:10px 0 18px}.screen-title h2{font-size:23px}.notice{padding:12px;border-radius:12px;background:rgba(184,243,74,.1);color:var(--green);font-size:12px;font-weight:800;margin-top:10px}
.bottom-nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:520px;height:78px;background:rgba(11,15,20,.96);backdrop-filter:blur(18px);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(4,1fr);z-index:10;padding-bottom:env(safe-area-inset-bottom)}
.nav-item{border:0;background:transparent;color:var(--muted);display:grid;place-items:center;align-content:center;gap:3px;font-size:20px}.nav-item small{font-size:10px;font-weight:800}.nav-item.active{color:var(--green)}
.toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,20px);background:var(--green);color:#0B0F14;padding:12px 15px;border-radius:12px;font-size:12px;font-weight:900;opacity:0;pointer-events:none;transition:.25s;z-index:20;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
@media(min-width:700px){body{padding:20px}.bottom-nav{bottom:20px;border:1px solid var(--border);border-radius:20px}.topbar{border-radius:20px 20px 0 0}}

</style>
  <title>FitTrack — V1</title>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div>
        <div class="eyebrow" id="todayLabel">QUARTA • 07 OUT</div>
        <h1 id="pageTitle">Olá, Samuel 👋</h1>
      </div>
      <button class="icon-btn" aria-label="Notificações">♧</button>
    </header>

    <main id="screen" class="screen"></main>

    <nav class="bottom-nav">
      <button class="nav-item active" data-screen="home"><span>⌂</span><small>Início</small></button>
      <button class="nav-item" data-screen="workouts"><span>♜</span><small>Treinos</small></button>
      <button class="nav-item" data-screen="progress"><span>⌁</span><small>Evolução</small></button>
      <button class="nav-item" data-screen="profile"><span>○</span><small>Perfil</small></button>
    </nav>
  </div>

  <div id="toast" class="toast"></div>
  <script>
const state = {
  screen: "home",
  activeWorkout: null,
  activeExercise: null,
  selectedPeriod: "3M",
  exercises: [
    {id:"supino", name:"Supino reto", group:"Peito", sets:4, reps:10, last:30, current:32, history:[20,22,24,26,28,30,32]},
    {id:"inclinado", name:"Supino inclinado", group:"Peito", sets:4, reps:10, last:24, current:26, history:[18,20,20,22,24,24,26]},
    {id:"crucifixo", name:"Crucifixo", group:"Peito", sets:3, reps:12, last:14, current:16, history:[10,10,12,12,14,14,16]},
    {id:"triceps", name:"Tríceps pulley", group:"Tríceps", sets:4, reps:12, last:35, current:38, history:[28,30,30,32,34,35,38]},
    {id:"puxada", name:"Puxada frontal", group:"Costas", sets:4, reps:10, last:45, current:50, history:[35,38,40,42,45,45,50]},
    {id:"remada", name:"Remada baixa", group:"Costas", sets:4, reps:10, last:42, current:45, history:[32,35,38,38,40,42,45]}
  ],
  workouts: [
    {id:"A", name:"Peito + Tríceps", duration:"~55 min", exercises:["supino","inclinado","crucifixo","triceps"]},
    {id:"B", name:"Costas + Bíceps", duration:"~50 min", exercises:["puxada","remada"]},
    {id:"C", name:"Pernas", duration:"~60 min", exercises:["supino"]},
    {id:"D", name:"Ombros + Abdômen", duration:"~45 min", exercises:["supino"]}
  ],
  setsDone: {}
};

const $ = s => document.querySelector(s);
const getEx = id => state.exercises.find(e=>e.id===id);
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800)}
function nav(screen){state.screen=screen;state.activeWorkout=null;state.activeExercise=null;render()}
function setNav(){document.querySelectorAll(".nav-item").forEach(b=>b.classList.toggle("active",b.dataset.screen===state.screen))}
document.querySelectorAll(".nav-item").forEach(b=>b.addEventListener("click",()=>nav(b.dataset.screen)));

function header(title, eyebrow="QUARTA • 07 OUT"){ $("#todayLabel").textContent=eyebrow; $("#pageTitle").textContent=title; }

function home(){
 header("Olá, Samuel 👋");
 const last = getEx("supino");
 return `<div class="screen-title"><div><div class="eyebrow">BORA EVOLUIR HOJE?</div></div></div>
 <section class="hero">
   <span class="tag">TREINO DE HOJE</span><h2>Peito + Tríceps</h2><p>6 exercícios • ${"55 min"}</p>
   <button class="primary" onclick="openWorkout('A')">COMEÇAR TREINO →</button>
 </section>
 <div class="stats">
   <div class="stat"><div class="value">12</div><div class="label">Treinos este mês</div><div class="up">+3 vs mês anterior</div></div>
   <div class="stat"><div class="value">12.540 kg</div><div class="label">Volume total</div><div class="up">+18%</div></div>
   <div class="stat"><div class="value">32 kg</div><div class="label">Recorde • Supino</div><div class="record">🏆 PR atual</div></div>
   <div class="stat"><div class="value">3 dias</div><div class="label">Sequência</div><div class="up">🔥 consistente</div></div>
 </div>
 <div class="section-head"><h2>Evolução recente</h2><button class="link" onclick="nav('progress')">Ver tudo</button></div>
 ${chartCard(last,"home")}
 `;
}

function chartCard(ex, mode="progress"){
 const vals=ex.history, max=Math.max(...vals)+5, min=Math.max(0,Math.min(...vals)-5);
 const W=360,H=180,p=28;
 const pts=vals.map((v,i)=>{const x=p+i*(W-2*p)/(vals.length-1);const y=H-p-(v-min)/(max-min)*(H-2*p);return [x,y,v]});
 const poly=pts.map(p=>p.slice(0,2).join(",")).join(" ");
 return `<div class="card chart-card">
   <div class="chart-title">${ex.name} • carga</div>
   <div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}">
    <line class="axis" x1="${p}" y1="${H-p}" x2="${W-p}" y2="${H-p}"/>
    <line class="axis" x1="${p}" y1="${p}" x2="${p}" y2="${H-p}"/>
    <polyline class="line" points="${poly}"/>
    ${pts.map((pt,i)=>`<circle class="dot" cx="${pt[0]}" cy="${pt[1]}" r="4"/><text class="chart-value" x="${pt[0]}" y="${pt[1]-9}" text-anchor="middle">${pt[2]}</text>`).join("")}
    <text class="chart-label" x="${p}" y="${H-7}">01/09</text><text class="chart-label" x="${W-p}" y="${H-7}" text-anchor="end">06/10</text>
   </svg></div>
   <div class="progress-grid"><div class="progress-box"><strong>${ex.current} kg</strong><span>Carga atual</span></div><div class="progress-box"><strong class="record">+${ex.current-ex.history[0]} kg</strong><span>Desde o início</span></div></div>
 </div>`;
}

function workouts(){
 header("Treinos","SEUS TREINOS");
 return `<div class="tabs"><button class="tab active">Meus treinos</button><button class="tab" onclick="toast('Biblioteca de exercícios em breve')">Exercícios</button><button class="tab" onclick="toast('Histórico em breve')">Histórico</button></div>
 <div class="stack">${state.workouts.map(w=>`<div class="card workout-card"><div class="workout-icon">${w.id}</div><div class="workout-info"><strong>${w.name}</strong><span>${w.exercises.length+2} exercícios • ${w.duration}</span></div><button class="play" onclick="openWorkout('${w.id}')">▶</button></div>`).join("")}</div>`;
}

function openWorkout(id){state.activeWorkout=id;state.screen="workout";render()}
function workoutScreen(){
 const w=state.workouts.find(x=>x.id===state.activeWorkout)||state.workouts[0];
 header("Treino "+w.id,w.name.toUpperCase());
 return `<div class="screen-title"><button class="back" onclick="nav('workouts')">‹</button><div><h2>${w.name}</h2><p style="color:var(--muted);font-size:12px">2 de ${w.exercises.length+2} exercícios</p></div></div>
 <div class="card" style="margin-bottom:12px"><div style="height:8px;background:var(--panel2);border-radius:9px"><div style="height:100%;width:33%;background:var(--green);border-radius:9px"></div></div><div style="font-size:11px;color:var(--muted);margin-top:8px">Progresso do treino</div></div>
 <div class="stack">${w.exercises.map(id=>exerciseCard(getEx(id))).join("")}</div>`;
}

function exerciseCard(ex){
 const done=state.setsDone[ex.id]||0;
 return `<div class="card exercise-card">
   <div class="exercise-top"><div><div class="exercise-name">${ex.name}</div><div class="exercise-meta">${ex.sets} séries × ${ex.reps} reps • Última: ${ex.last} kg</div></div><span class="pill">${ex.group}</span></div>
   <button class="secondary" style="width:100%;margin-top:12px" onclick="openExercise('${ex.id}')">Registrar carga →</button>
   ${done?`<div class="notice">✓ ${done} série${done>1?'s':''} registrada${done>1?'s':''}</div>`:""}
 </div>`;
}

function openExercise(id){state.activeExercise=id;state.screen="exercise";render()}
function exerciseScreen(){
 const ex=getEx(state.activeExercise); header(ex.name,ex.group.toUpperCase());
 const done=state.setsDone[ex.id]||0;
 return `<div class="screen-title"><button class="back" onclick="openWorkout('${state.activeWorkout||"A"}')">‹</button><div><h2>${ex.name}</h2><p style="color:var(--muted);font-size:12px">${ex.group} • ${ex.sets} × ${ex.reps}</p></div></div>
 <div class="tabs"><button class="tab active">Registro</button><button class="tab" onclick="toast('Histórico exibido na tela Evolução')">Histórico</button><button class="tab" onclick="nav('progress')">Evolução</button></div>
 <div class="card"><div class="section-head" style="margin:0 0 10px"><h2>Última vez</h2><span class="pill">${ex.last} kg × ${ex.reps}</span></div>
   <div class="notice">↑ +${ex.current-ex.last} kg disponível para testar hoje</div>
   <div class="stack" style="margin-top:12px">${Array.from({length:ex.sets},(_,i)=>`
    <div class="exercise-row"><strong>Série ${i+1}</strong>
      <input class="input" id="weight-${i}" type="number" min="0" step="0.5" value="${i<done?ex.current:ex.current}">
      <input class="input" id="reps-${i}" type="number" min="1" value="${ex.reps}">
      <button class="check ${i<done?'done':''}" onclick="completeSet('${ex.id}',${i})">${i<done?'✓':'○'}</button>
    </div>`).join("")}</div>
   <button class="primary" onclick="saveSeries('${ex.id}')">+ REGISTRAR SÉRIE</button>
   <button class="secondary" style="width:100%;margin-top:10px" onclick="finishExercise('${ex.id}')">✓ Finalizar exercício</button>
 </div>`;
}

function completeSet(id,i){state.setsDone[id]=Math.max(state.setsDone[id]||0,i+1);render();toast("Série concluída ✓")}
function saveSeries(id){const ex=getEx(id);const weight=Number(document.querySelector("#weight-0").value)||ex.current;if(weight>ex.current){ex.current=weight;ex.history.push(weight);toast("🚀 Novo recorde! +"+(weight-ex.last)+" kg")}else{toast("Série registrada ✓")}state.setsDone[id]=Math.min(ex.sets,(state.setsDone[id]||0)+1);render()}
function finishExercise(id){state.setsDone[id]=getEx(id).sets;toast("Exercício finalizado ✓");setTimeout(render,300)}

function progress(){
 header("Evolução","SEU PROGRESSO");
 const ex=getEx("supino");
 return `<div class="tabs">${["1M","3M","6M","1A","Tudo"].map(p=>`<button class="tab ${state.selectedPeriod===p?'active':''}" onclick="state.selectedPeriod='${p}';render()">${p}</button>`).join("")}</div>
 <div class="stats"><div class="stat"><div class="value">12.540 kg</div><div class="label">Carga total</div><div class="up">+18%</div></div><div class="stat"><div class="value">12</div><div class="label">Treinos</div><div class="up">+33%</div></div><div class="stat"><div class="value">8</div><div class="label">PRs conquistados</div><div class="up">+4</div></div><div class="stat"><div class="value">3×/sem</div><div class="label">Frequência</div><div class="up">+1</div></div></div>
 <div class="section-head"><h2>Evolução da carga</h2></div>${chartCard(ex,"progress")}
 <div class="section-head"><h2>Exercícios</h2></div><div class="stack">${state.exercises.slice(0,4).map(e=>`<div class="card workout-card" onclick="openExercise('${e.id}')"><div class="workout-icon" style="background:var(--panel2);color:var(--green)">↗</div><div class="workout-info"><strong>${e.name}</strong><span>${e.current} kg • +${e.current-e.history[0]} kg desde o início</span></div><span class="record">›</span></div>`).join("")}</div>`;
}

function profile(){
 header("Perfil","CONTA");
 return `<div class="card profile"><div class="avatar">S</div><div><h2>Samuel</h2><p style="color:var(--muted);font-size:12px;margin-top:3px">Em constante evolução 💪</p></div></div>
 <div class="stats"><div class="stat"><div class="value">12</div><div class="label">Treinos</div></div><div class="stat"><div class="value">75%</div><div class="label">Frequência</div></div></div>
 <div class="card" style="margin-top:12px"><div class="menu-row"><strong>Meus treinos</strong><span>›</span></div><div class="menu-row"><strong>Meus exercícios</strong><span>›</span></div><div class="menu-row"><strong>Configurações</strong><span>›</span></div><div class="menu-row"><strong>Backup e sincronização</strong><span>Em breve</span></div></div>`;
}

function render(){
 setNav();
 const screen=$("#screen");
 if(state.screen==="home")screen.innerHTML=home();
 else if(state.screen==="workouts")screen.innerHTML=workouts();
 else if(state.screen==="workout")screen.innerHTML=workoutScreen();
 else if(state.screen==="exercise")screen.innerHTML=exerciseScreen();
 else if(state.screen==="progress")screen.innerHTML=progress();
 else if(state.screen==="profile")screen.innerHTML=profile();
 window.scrollTo({top:0,behavior:"smooth"});
}
render();

</script>

<script>
/* FitTrack One-File: persistence for the current device */
(function(){
  const KEY="fittrack-v1-state";
  const originalRender=window.render;
  function save(){
    try{
      localStorage.setItem(KEY, JSON.stringify({
        exercises: state.exercises.map(e=>({id:e.id,current:e.current,history:e.history})),
        setsDone: state.setsDone
      }));
    }catch(e){}
  }
  function load(){
    try{
      const saved=JSON.parse(localStorage.getItem(KEY)||"null");
      if(!saved) return;
      if(saved.exercises) saved.exercises.forEach(s=>{
        const e=state.exercises.find(x=>x.id===s.id);
        if(e){ e.current=s.current ?? e.current; e.history=s.history ?? e.history; }
      });
      if(saved.setsDone) state.setsDone=saved.setsDone;
    }catch(e){}
  }
  load();
  const oldSaveSeries=window.saveSeries;
  window.saveSeries=function(id){
    oldSaveSeries(id);
    save();
  };
  const oldCompleteSet=window.completeSet;
  window.completeSet=function(id,i){
    oldCompleteSet(id,i);
    save();
  };
  const oldFinishExercise=window.finishExercise;
  window.finishExercise=function(id){
    oldFinishExercise(id);
    save();
  };
  // Save after initial state and show a one-time local-storage hint.
  window.addEventListener("beforeunload",save);
})();
</script>

</body>
</html>
