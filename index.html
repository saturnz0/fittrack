function load(){
 try{
  const x=JSON.parse(localStorage.getItem(KEY));
  if(x){
    const existingIds=new Set((x.exercises||[]).map(e=>e.id));
    const missing=seedExercises.filter(e=>!existingIds.has(e.id));
    x.exercises=[...(x.exercises||[]),...missing];
    x.workouts=x.workouts||seedWorkouts;
    x.history=x.history||{};
    x.sessions=x.sessions||[];
    return x;
  }
 }catch(e){}
 return {exercises:seedExercises,workouts:seedWorkouts,history:{},sessions:[]};
}

function uid(p='id'){return p+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,6)}

 const html=`<div class="modalWrap"><div class="modal"><div class="modalHead"><h3>Filtros</h3><button class="iconbtn" onclick="closeModal()">×</button></div>
 <label class="formlabel">GRUPO MUSCULAR</label><select id="fMuscle" class="select">${['Todos','Peito','Costas','Pernas','Posterior de coxa','Ombros','Bíceps','Tríceps','Glúteos','Abdômen','Panturrilha','Antebraço','Cardio'].map(x=>`<option ${state.libMuscle===x?'selected':''}>${x}</option>`).join('')}</select>
 <label class="formlabel">EQUIPAMENTO</label><select id="fEquip" class="select">${['Todos','Barra','Halteres','Máquina','Polia','Peso corporal'].map(x=>`<option ${state.libEquipment===x?'selected':''}>${x}</option>`).join('')}</select>
 <button class="btn" style="width:100%;margin-top:16px" onclick="applyFilters()">APLICAR FILTROS</button></div></div>`;
 document.getElementById('overlay').innerHTML=html;
}
function applyFilters(){state.libMuscle=document.getElementById('fMuscle').value;state.libEquipment=document.getElementById('fEquip').value;closeModal();render()}
function toggleSelect(id){const i=state.selected.indexOf(id);if(i>=0)state.selected.splice(i,1);else state.selected.push(id);render()}
function alreadyAdded(){toast('Este exercício já está neste treino')}
function addSelectedToWorkout(){
 const existing=new Set(state.workoutDraft.exercises.map(x=>x.exerciseId));
 state.selected.filter(id=>!existing.has(id)).forEach(id=>state.workoutDraft.exercises.push({exerciseId:id,sets:3,reps:10,rest:90}));
 state.selected=[];setScreen('createWorkout');toast('Exercícios adicionados')
}
function backFromLibrary(){state.selected=[];setScreen(state.libraryReturn==='workoutEdit'?'createWorkout':'workouts')}
function openExerciseForm(prefill=''){state.editingExercise=null;state.formPrefill=prefill;setScreen('exerciseForm')}
function exerciseForm(){
 const e=state.editingExercise||{name:state.formPrefill||'',muscle:'Peito',equipment:'Halteres',unit:'kg',notes:''};
 const edit=!!state.editingExercise;
 return `<div class="top"><div class="backline" style="margin:0"><button class="link" onclick="setScreen('library')">‹</button><b>${edit?'EDITAR':'NOVO'} EXERCÍCIO</b></div></div>
 <div class="screen"><div class="card">
 <label class="formlabel">NOME *</label><input id="en" class="input" value="${esc(e.name)}" placeholder="Ex: Supino máquina">
 <label class="formlabel">GRUPO MUSCULAR *</label><select id="em" class="select">${['Peito','Costas','Pernas','Posterior de coxa','Ombros','Bíceps','Tríceps','Glúteos','Abdômen','Panturrilha','Antebraço','Cardio'].map(x=>`<option ${e.muscle===x?'selected':''}>${x}</option>`).join('')}</select>
 <label class="formlabel">EQUIPAMENTO</label><select id="ee" class="select">${['Barra','Halteres','Máquina','Polia','Peso corporal','Outro'].map(x=>`<option ${e.equipment===x?'selected':''}>${x}</option>`).join('')}</select>
 <label class="formlabel">UNIDADE DE CARGA</label><div class="toggleRow"><button class="toggle ${e.unit==='kg'?'active':''}" id="kg" onclick="pickUnit('kg')">KG</button><button class="toggle ${e.unit==='lb'?'active':''}" id="lb" onclick="pickUnit('lb')">LB</button></div>
 <input id="eu" type="hidden" value="${e.unit}">
 <label class="formlabel">OBSERVAÇÕES</label><textarea id="eno" class="textarea" placeholder="Opcional">${esc(e.notes||'')}</textarea>
 </div><button class="btn" style="width:100%" onclick="saveCustomExercise()">${edit?'SALVAR ALTERAÇÕES':'CRIAR EXERCÍCIO'}</button></div>`;
}
function pickUnit(u){document.getElementById('eu').value=u;document.getElementById('kg').classList.toggle('active',u==='kg');document.getElementById('lb').classList.toggle('active',u==='lb')}
function saveCustomExercise(){
 const name=document.getElementById('en').value.trim(),muscle=document.getElementById('em').value;
 if(!name){toast('O nome do exercício é obrigatório');return}
 const duplicate=db.exercises.find(x=>x.name.toLowerCase()===name.toLowerCase()&&x.id!==state.editingExercise?.id);
 if(duplicate&&!confirm(`Já existe "${duplicate.name}". Criar mesmo assim?`))return;
 if(state.editingExercise){
  Object.assign(state.editingExercise,{name,muscle,equipment:document.getElementById('ee').value,unit:document.getElementById('eu').value,notes:document.getElementById('eno').value.trim()});
 }else{
  const e={id:uid('ex'),name,muscle,equipment:document.getElementById('ee').value,unit:document.getElementById('eu').value,notes:document.getElementById('eno').value.trim(),isCustom:true};
  db.exercises.push(e);state.selected=[e.id];
  if(state.workoutDraft&&!state.workoutDraft.exercises.some(x=>x.exerciseId===e.id))state.workoutDraft.exercises.push({exerciseId:e.id,sets:3,reps:10,rest:90});
 }
 save();setScreen('library');toast(state.editingExercise?'Exercício atualizado':'Exercício criado')
}
function exerciseMenu(id){
 const e=exById(id);
 document.getElementById('overlay').innerHTML=`<div class="modalWrap"><div class="modal"><div class="modalHead"><h3>${esc(e.name)}</h3><button class="iconbtn" onclick="closeModal()">×</button></div>
 <button class="btn secondary" style="width:100%;margin-bottom:8px" onclick="editCustomExercise('${id}')">✏ Editar</button>
 <button class="btn secondary" style="width:100%;margin-bottom:8px" onclick="duplicateExercise('${id}')">⧉ Duplicar</button>
 <button class="btn danger" style="width:100%" onclick="deleteExercise('${id}')">🗑 Excluir</button></div></div>`;
}
function editCustomExercise(id){closeModal();state.editingExercise=exById(id);setScreen('exerciseForm')}
function duplicateExercise(id){const e=exById(id),n=JSON.parse(JSON.stringify(e));n.id=uid('ex');n.name=e.name+' (cópia)';n.isCustom=true;db.exercises.push(n);save();closeModal();render();toast('Exercício duplicado')}
function deleteExercise(id){
 const e=exById(id);if(!confirm(`Excluir "${e.name}"? O histórico será preservado.`))return;
 db.exercises=db.exercises.filter(x=>x.id!==id);db.workouts.forEach(w=>w.exercises=w.exercises.filter(x=>x.exerciseId!==id));save();closeModal();render();toast('Exercício excluído')
}

function startWorkout(id){state.activeWorkout=id;state.activeExercise=0;state.setsDone=[];setScreen('register')}
function register(){
 const w=db.workouts.find(x=>x.id===state.activeWorkout);if(!w)return workouts();
 const c=w.exercises[state.activeExercise],e=exById(c.exerciseId);
 const history=db.history[e.id]||{lastWeight:0,pr:0};
 if(!state.setsDone.length)state.setsDone=Array.from({length:c.sets},()=>({weight:history.lastWeight||0,reps:c.reps,done:false}));
 const done=state.setsDone.filter(s=>s.done).length;
 const all=done===state.setsDone.length;
 return shell(`<div class="screen"><div class="backline"><button class="link" onclick="setScreen('workouts')">‹ Sair</button><span class="muted">${esc(w.name)}</span></div>
 <div class="eyebrow">Exercício ${state.activeExercise+1} de ${w.exercises.length}</div><div class="title" style="margin-bottom:5px">${esc(e.name)}</div><div class="subtitle">${e.muscle} · ${e.equipment}</div>
 <div class="card" style="margin-top:16px"><div class="row between"><div><div class="eyebrow">Último treino</div><b>${history.lastWeight||0} ${e.unit} × ${history.lastReps||c.reps}</b></div><div><div class="eyebrow">Sugestão</div><b class="green">${suggest(history.lastWeight||0)} ${e.unit}</b></div></div></div>
 ${state.setsDone.map((s,i)=>`<div class="setCard ${s.done?'done':''}"><div class="row between"><b>Série ${i+1}</b>${s.done?'<span class="pr">✓ Concluída</span>':''}</div><div class="grid2" style="margin-top:12px"><div><div class="small muted">CARGA</div><div class="stepper"><button onclick="stepSet(${i},'weight',-1)">−</button><input type="number" value="${s.weight}" onchange="setVal(${i},'weight',this.value)"><button onclick="stepSet(${i},'weight',1)">＋</button></div></div><div><div class="small muted">REPS</div><div class="stepper"><button onclick="stepSet(${i},'reps',-1)">−</button><input type="number" value="${s.reps}" onchange="setVal(${i},'reps',this.value)"><button onclick="stepSet(${i},'reps',1)">＋</button></div></div></div>${s.done?`<button class="btn secondary" style="width:100%;margin-top:10px" onclick="editSet(${i})">Editar série</button>`:`<button class="btn" style="width:100%;margin-top:10px" onclick="completeSet(${i})">CONCLUIR SÉRIE</button>`}</div>`).join('')}
 ${all?`<div class="card"><div class="eyebrow">Resumo</div><h3>Exercício concluído 🎉</h3><div class="grid2"><div><div class="stat">${volumeCurrent()} ${e.unit}</div><div class="statlabel">Volume</div></div><div><div class="stat">${state.setsDone.length}</div><div class="statlabel">Séries</div></div></div><button class="btn" style="width:100%;margin-top:14px" onclick="nextExercise()">PRÓXIMO EXERCÍCIO</button></div>`:''}
 </div>${nav()}`);
}
function suggest(w){return w?Math.round((w*1.025)*2)/2:5}
function stepSet(i,k,d){let v=+state.setsDone[i][k]||0;v+=k==='weight'?d*(v>=20?2.5:1):d;state.setsDone[i][k]=Math.max(0,v);render()}
function setVal(i,k,v){state.setsDone[i][k]=Math.max(0,+v||0);render()}
function completeSet(i){state.setsDone[i].done=true;render()}
function editSet(i){state.setsDone[i].done=false;render()}
function volumeCurrent(){return state.setsDone.reduce((a,s)=>a+s.weight*s.reps,0)}
function nextExercise(){
 const w=db.workouts.find(x=>x.id===state.activeWorkout);
 const e=exById(w.exercises[state.activeExercise].exerciseId);
 const vol=volumeCurrent(), weights=state.setsDone.map(s=>s.weight), max=Math.max(...weights);
 db.history[e.id]={lastWeight:max,lastReps:state.setsDone[state.setsDone.length-1].reps,pr:Math.max(db.history[e.id]?.pr||0,max)};
 if(state.activeExercise===w.exercises.length-1){
  db.sessions.push({id:uid('s'),date:new Date().toISOString(),workoutId:w.id,volume:vol});
  save();toast('Treino concluído!');setTimeout(()=>setScreen('workouts'),700);
 }else{save();state.activeExercise++;state.setsDone=[];render()}
}
function progress(){
 const h=Object.entries(db.history);
 return shell(`<div class="screen"><div class="eyebrow">Desempenho</div><div class="title">Evolução</div><div class="card"><div class="eyebrow">Carga máxima registrada</div><div class="chart">${h.slice(-10).map(([id,x])=>`<div class="bar" style="height:${Math.max(8,Math.min(100,x.lastWeight||5))}%"></div>`).join('')||'<div class="subtitle">Registre seus treinos para visualizar sua evolução.</div>'}</div></div>
 ${h.map(([id,x])=>`<div class="card row between"><div><b>${esc(exById(id)?.name||'Exercício')}</b><div class="small muted">Última carga · ${x.lastWeight} kg</div></div><div class="pr">${x.pr} kg</div></div>`).join('')}</div>${nav()}`);
}
function profile(){
 return shell(`<div class="screen"><div class="eyebrow">Conta local</div><div class="title">Perfil</div><div class="card"><h3>FitTrack</h3><div class="subtitle">Seus dados ficam salvos neste aparelho através do armazenamento local.</div></div><div class="card"><div class="row between"><div><b>Biblioteca</b><div class="small muted">${db.exercises.length} exercícios</div></div><button class="btn secondary" onclick="openLibraryFromProfile()">Abrir</button></div></div><div class="card"><div class="row between"><div><b>Dados</b><div class="small muted">Exportar ou limpar dados</div></div><button class="btn danger" onclick="clearData()">Limpar</button></div></div></div>${nav()}`);
}
function openLibraryFromProfile(){state.workoutDraft={id:'temp',name:'Biblioteca',description:'',days:[],exercises:[]};state.libraryReturn='workouts';state.selected=[];setScreen('library')}
function clearData(){if(confirm('Limpar todos os dados locais do FitTrack?')){localStorage.removeItem(KEY);db=load();setScreen('home')}}
function bind(){
 const s=document.getElementById('libSearch');
 if(s){s.addEventListener('input',e=>{state.libQuery=e.target.value;render();const x=document.getElementById('libSearch');x?.focus();x?.setSelectionRange(x.value.length,x.value.length)});document.getElementById('clearSearch')?.addEventListener('click',()=>{state.libQuery='';render()})}
 document.querySelectorAll('[data-day]').forEach(b=>b.addEventListener('click',()=>{const x=b.dataset.day;const i=state.workoutDraft.days.indexOf(x);if(i>=0)state.workoutDraft.days.splice(i,1);else state.workoutDraft.days.push(x);render()}))
}
render();
</script>
</body>
</html>
